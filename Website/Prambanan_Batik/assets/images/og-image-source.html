<!DOCTYPE html>
<!-- Source for assets/images/og-image.png (1200x630 social-preview image). Regenerate after editing:
     msedge --headless=new --disable-gpu --hide-scrollbars --force-device-scale-factor=1 --window-size=1200,630 --virtual-time-budget=8000 --screenshot=og-image.png og-image-source.html -->
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; }
  body { width: 1200px; height: 630px; overflow: hidden; background: #2a1a0e; }
  .card {
    position: relative; width: 1200px; height: 630px; overflow: hidden;
    background: radial-gradient(ellipse at 20% 30%, #3d2614 0%, #2a1a0e 60%, #1e1208 100%);
    font-family: 'Inter', sans-serif; color: #fdf8f2;
  }
  .motif { position: absolute; right: -40px; top: -40px; width: 560px; height: 710px; opacity: 0.9; }
  .fade {
    position: absolute; inset: 0;
    background: linear-gradient(90deg, #2a1a0e 0%, #2a1a0e 40%, rgba(42,26,14,0.55) 62%, rgba(42,26,14,0) 85%);
  }
  .content { position: absolute; left: 88px; top: 0; bottom: 0; width: 640px; display: flex; flex-direction: column; justify-content: center; }
  .brand { display: flex; align-items: center; gap: 18px; margin-bottom: 40px; }
  .brand svg { width: 64px; height: 64px; border-radius: 14px; }
  .eyebrow { font-size: 22px; font-weight: 600; letter-spacing: 0.22em; text-transform: uppercase; color: #c4872c; }
  h1 { font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 500; font-size: 92px; line-height: 0.98; margin: 0 0 30px; color: #fdf8f2; }
  h1 em { color: #e8c47a; font-style: italic; }
  .rule { width: 96px; height: 3px; background: #c4872c; margin-bottom: 28px; border-radius: 2px; }
  p { font-size: 27px; line-height: 1.45; margin: 0; color: rgba(253,248,242,0.78); font-weight: 400; }
  .footer { position: absolute; left: 88px; bottom: 44px; font-size: 19px; letter-spacing: 0.08em; color: rgba(232,196,122,0.75); }
</style>
</head>
<body>
<div class="card">
  <svg class="motif" viewBox="0 0 560 710" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <pattern id="k" width="140" height="140" patternUnits="userSpaceOnUse">
        <g transform="translate(70 70)">
          <g fill="#c4872c" fill-opacity="0.34">
            <ellipse cy="-20.7" rx="21" ry="32.2"/>
            <ellipse cy="-20.7" rx="21" ry="32.2" transform="rotate(90)"/>
            <ellipse cy="-20.7" rx="21" ry="32.2" transform="rotate(180)"/>
            <ellipse cy="-20.7" rx="21" ry="32.2" transform="rotate(270)"/>
          </g>
          <circle r="15.4" fill="#e8c47a" fill-opacity="0.45"/>
        </g>
        <circle cx="0" cy="0" r="6" fill="#e8c47a" fill-opacity="0.25"/>
        <circle cx="140" cy="0" r="6" fill="#e8c47a" fill-opacity="0.25"/>
        <circle cx="0" cy="140" r="6" fill="#e8c47a" fill-opacity="0.25"/>
        <circle cx="140" cy="140" r="6" fill="#e8c47a" fill-opacity="0.25"/>
      </pattern>
    </defs>
    <rect width="560" height="710" fill="url(#k)"/>
  </svg>
  <div class="fade"></div>
  <div class="content">
    <div class="brand">
      <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <rect width="100" height="100" fill="#1e1208"/>
        <g fill="#c4872c">
          <ellipse cx="50" cy="35.2" rx="15" ry="23"/>
          <ellipse cx="50" cy="35.2" rx="15" ry="23" transform="rotate(90 50 50)"/>
          <ellipse cx="50" cy="35.2" rx="15" ry="23" transform="rotate(180 50 50)"/>
          <ellipse cx="50" cy="35.2" rx="15" ry="23" transform="rotate(270 50 50)"/>
        </g>
        <circle cx="50" cy="50" r="11" fill="#e8c47a"/>
      </svg>
      <span class="eyebrow">Prambanan Batik</span>
    </div>
    <h1>Authentic Indonesian <em>Batik</em></h1>
    <div class="rule"></div>
    <p>Handcrafted traditional patterns, ready-to-wear and fabric — with trusted customer reviews.</p>
  </div>
  <div class="footer">Batik tulis · Batik cap · Kawung · Parang · Mega Mendung</div>
</div>
</body>
</html>
