<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b62da" />
    <title>PX Mart</title>
    <meta name="description" content="Search PX Mart Wufeng branch products and instantly find the aisle and shelf. A fast, bilingual product finder for Taiwan supermarkets." />

    <meta property="og:title" content="PX Mart - Store Product Finder" />
    <meta property="og:description" content="Quickly locate products in your local PX Mart store with bilingual aisle information." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://px-mart-finder.netlify.app/Images/Logo.png" />
    <meta property="og:site_name" content="PX Mart Finder" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="PX Mart - Store Product Finder" />
    <meta name="twitter:description" content="Quickly locate products in your local PX Mart store with bilingual aisle information." />
    <meta name="twitter:image" content="https://px-mart-finder.netlify.app/Images/Logo.png" />

    <link rel="icon" type="image/x-icon" href="/favicon_io/favicon.ico">
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon_io/android-chrome-192x192.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon_io/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon_io/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon_io/apple-touch-icon.png">
    <link rel="manifest" href="/favicon_io/site.webmanifest">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <style>
      #app-boot-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f7f9fb;
        transition: opacity 0.25s ease;
      }
      #app-boot-loader.hide {
        opacity: 0;
        pointer-events: none;
      }
      #app-boot-loader .spinner {
        width: 40px;
        height: 40px;
        border: 3px solid hsl(215 90% 45% / 0.15);
        border-top-color: hsl(215 90% 45%);
        border-radius: 50%;
        animation: app-boot-spin 0.7s linear infinite;
      }
      @keyframes app-boot-spin {
        to { transform: rotate(360deg); }
      }
      @media (prefers-color-scheme: dark) {
        #app-boot-loader { background: #0b1220; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="app-boot-loader" aria-hidden="true"><div class="spinner"></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
