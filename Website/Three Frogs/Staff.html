        <link rel="icon" type="image/png" sizes="16x16" href="Assets/Images/favicon_io/favicon-16x16.png" />

        <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Stylesheet -->
        <link rel="stylesheet" href="Assets/CSS/Boardgame.css?v=2026-10-24" />

    </head>

    <body>

        <header>
            <nav class="navbar">
                <a href="index.html" class="logo"><img src="Assets/Images/logo-mark.png" alt="" width="36" height="36" />Three Frogs</a>
                <button class="nav-toggle" id="navToggle" aria-label="Open navigation menu" aria-expanded="false"><span></span><span></span><span></span></button>
                <ul class="nav-links" id="navLinks"></ul>
            </nav>
        </header>

        <div id="staffLoadingState" class="loading-state">
            <span class="spinner" aria-hidden="true"></span>
            Checking your access…
        </div>

        <section id="staffDenied" class="login-container hidden">
            <h2>Staff only</h2>
            <p>Only Three Frogs staff accounts can open this page.</p>
            <p><a href="index.html">Back to the home page</a></p>
        </section>

        <section id="staffPanel" class="dashboard-container hidden">
            <h2>Bookings</h2>

            <div class="staff-toolbar">
                <button type="button" id="prevDayBtn" aria-label="Previous day">‹ Prev</button>
                <label for="staffDate" class="visually-hidden">Date</label>
                <input type="date" id="staffDate" />
                <button type="button" id="nextDayBtn" aria-label="Next day">Next ›</button>
                <button type="button" id="todayBtn">Today</button>
            </div>

            <p class="staff-summary" id="staffSummary"></p>
            <div class="staff-hours" id="staffHours" aria-label="Tables in use per hour"></div>
            <div id="staffBookings"></div>

            <div id="staffCancelPopup" class="cancel-popup hidden" role="dialog" aria-modal="true" aria-labelledby="staffCancelTitle">
                <div class="popup-content">
                    <h3 id="staffCancelTitle">Cancel this booking?</h3>
                    <p id="staffCancelText"></p>
                    <label for="staffCancelReason" class="visually-hidden">Reason (optional, included in the email)</label>
                    <textarea id="staffCancelReason" rows="3" maxlength="300" placeholder="Reason for the customer (optional), e.g. we're closed for a private event"></textarea>
                    <button id="staffConfirmCancel" class="popup-btn">Yes, cancel &amp; email customer</button>
                    <button id="staffClosePopup" class="popup-btn cancel">Keep it</button>
                </div>
            </div>
        </section>

        <footer>
            <p>&copy; <span class="copyright-years">2025–2026</span> Three Frogs Boardgame Surabaya</p>
            <p class="footer-links"><a href="Terms-of-Use.html">Terms of Use</a> · <a href="Privacy-Policy.html">Privacy Policy</a></p>
        </footer>

        <button id="scrollTopBtn" type="button" aria-label="Back to top"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg></button>
        
        <script src="Assets/JS/Notify.js?v=2026-10-24"></script>
        <script src="Assets/JS/Loading.js?v=2026-10-24"></script>
        <script src="Assets/JS/Staff.js?v=2026-10-24"></script>
        <script src="Assets/JS/Navbar.js?v=2026-10-24"></script>

    </body>

</html>
