        <!--
          This page is served directly by Apache's ErrorDocument for any
          missing URL, so the browser's address bar keeps showing whatever
          bogus path triggered the 404 (Apache doesn't redirect, it just
          swaps in this file's content). Without a <base> tag, every
          relative path below (CSS, JS, fetch() calls inside Navbar.js)
          would resolve against that bogus path instead of the site root
          and silently fail. Keep this tag — see .htaccess's ErrorDocument
          line and CLAUDE.md.
        -->
        <base href="/" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
