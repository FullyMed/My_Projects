<!DOCTYPE html>
<html lang="en">

    <head>

        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />

        <title>Forgot Password | Three Frogs Boardgame</title>
        <meta name="description" content="Reset your Three Frogs Boardgame password." />
        <meta name="author" content="Maximilliano Felix" />

        <!-- Open Graph Meta Tags -->
        <meta property="og:site_name" content="Three Frogs" />
        <meta property="og:title" content="Forgot Password | Three Frogs Boardgame" />
        <meta property="og:description" content="Reset your Three Frogs Boardgame password." />
        <meta property="og:url" content="https://threefrogsboardgame.com/Forgot-password.html" />

        <!-- Favicon Support -->
        <link rel="icon" type="image/png" sizes="32x32" href="Assets/Images/favicon_io/favicon-32x32.png" />
        <link rel="icon" type="image/png" sizes="16x16" href="Assets/Images/favicon_io/favicon-16x16.png" />
        <link rel="icon" type="image/x-icon" href="Assets/Images/favicon_io/favicon.ico" />
        <link rel="apple-touch-icon" href="Assets/Images/favicon_io/apple-touch-icon.png" />
        <link rel="manifest" href="Assets/Images/favicon_io/site.webmanifest" />

        <!-- Google Fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

        <!-- Stylesheet -->
        <link rel="stylesheet" href="Assets/CSS/Boardgame.css" />

    </head>

    <body>

        <header>
            <nav class="navbar">
                <a href="index.html" class="logo"><img src="Assets/Images/logo-mark.png" alt="" width="36" height="36" />Three Frogs</a>
                <button class="nav-toggle" id="navToggle" aria-label="Open navigation menu" aria-expanded="false"><span></span><span></span><span></span></button>
                <ul class="nav-links" id="navLinks"></ul>
            </nav>
        </header>

        <section class="booking-form">
            <h2>Reset your password</h2>

            <!-- Step 1: request a reset link -->
            <div id="requestStep">
                <p>Enter your email address and we'll send you a link to reset your password.</p>
                <form id="requestForm">
                    <label for="resetEmail">Email</label>
                    <input type="email" id="resetEmail" name="email" placeholder="The email you signed up with" required />
                    <button type="submit">Send reset link</button>
                </form>
                <div id="requestResult"></div>
            </div>

            <!-- Step 2: set a new password (shown when ?token= is present in the URL) -->
            <div id="resetStep" class="hidden">
                <p>Choose a new password with at least 8 characters.</p>
                <form id="forgotForm">
                    <label for="newPassword">New password</label>
                    <div class="password-wrapper">
                        <input type="password" id="newPassword" name="password" placeholder="At least 8 characters" required />
                        <button type="button" id="toggleForgotPassword" class="toggle-password" aria-label="Show password" aria-pressed="false"></button>
                    </div>
                    <button type="submit">Save new password</button>
                </form>
                <div id="forgotResult"></div>
            </div>
        </section>

        <footer>
            <p>&copy; <span class="copyright-years">2025–2026</span> Three Frogs Boardgame Surabaya</p>
            <p class="footer-links"><a href="Terms-of-Use.html">Terms of Use</a> · <a href="Privacy-Policy.html">Privacy Policy</a></p>
        </footer>

        <button id="scrollTopBtn" type="button" aria-label="Back to top"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg></button>

        <script src="Assets/JS/Notify.js"></script>
        <script src="Assets/JS/Loading.js"></script>
        <script src="Assets/JS/Forgot-password.js"></script>
        <script src="Assets/JS/Navbar.js"></script>

    </body>
</html>
