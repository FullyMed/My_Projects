plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}


// Release signing is used only when android/key.properties exists AND is fully
// filled in AND points at a keystore file that actually exists. Otherwise the
// release build falls back to debug signing so `flutter run --release` and
// local test builds keep working. A Play Store build REQUIRES a real keystore.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
def useReleaseSigning = false
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
    def storeFilePath = keystoreProperties['storeFile']
    useReleaseSigning =
        storeFilePath != null && !storeFilePath.trim().isEmpty() &&
        file(storeFilePath).exists() &&
        keystoreProperties['storePassword'] && keystoreProperties['storePassword'] != 'CHANGE_ME' &&
        keystoreProperties['keyPassword'] && keystoreProperties['keyPassword'] != 'CHANGE_ME' &&
        keystoreProperties['keyAlias']
    if (!useReleaseSigning) {
        logger.warn("WARNING: android/key.properties is present but incomplete " +
            "(placeholder values, or keystore file not found). The release build " +
            "will be DEBUG-SIGNED and is not suitable for distribution.")
    }
}

android {
    namespace = "com.felix.taiwanfarefinder"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    signingConfigs {
        if (useReleaseSigning) {
            release {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            }
        }
    }

    defaultConfig {
        applicationId = "com.felix.taiwanfarefinder"
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    buildTypes {
        release {
            signingConfig = useReleaseSigning ? signingConfigs.release : signingConfigs.debug

            // Strip and obfuscate Java/Kotlin with R8, and drop unused resources.
            // Dart-side obfuscation is separate — build with:
            //   flutter build apk --release --obfuscate \
            //     --split-debug-info=build/symbols
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

flutter {
    source = "../.."
}
