name: taiwan_fare_finder
description: "Look up and compare public transport fares across Taiwan: HSR, TRA, MRT, bus and YouBike."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  package_info_plus: ^9.0.0
  intl: 0.20.2
  shared_preferences: ^2.0.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  go_router: ^16.2.0
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  generate: true
  uses-material-design: true
  assets:
    - lib/l10n/
  fonts:
    - family: Plus Jakarta Sans
      fonts:
        # Static weights cut from PlusJakartaSans-VariableFont_wght.ttf by
        # scripts/gen_fonts.py. Flutter does NOT map FontWeight onto a variable
        # font's wght axis (every weight rendered as Regular), so each weight
        # the app uses ships as its own file.
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icons/app_icon.png
  remove_alpha_ios: true
  web:
    generate: true
    image_path: assets/icons/app_icon.png
    background_color: "#0F766E"
    theme_color: "#0F766E"